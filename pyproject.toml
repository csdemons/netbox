[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-plan"
version = "0.5.1"
description = "Русскоязычный NetBox Plan: учёт устройств, проектов и первого кабеля до Interface или FrontPort"
readme = "README.md"
keywords = ["netbox", "plugin", "dcim", "cabling", "patch-panel", "fibre-channel"]
classifiers = ["Programming Language :: Python :: 3", "Framework :: Django", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Source = "https://github.com/csdemons/netbox"

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_server_wizard*"]

[tool.setuptools.package-data]
netbox_server_wizard = ["templates/netbox_server_wizard/*.html"]
