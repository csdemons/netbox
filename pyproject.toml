[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-server-wizard"
version = "0.3.0"
description = "Русскоязычный мастер добавления серверов, Ethernet/FC адаптеров и проектов в NetBox"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_server_wizard*"]

[tool.setuptools.package-data]
netbox_server_wizard = ["templates/netbox_server_wizard/*.html"]
