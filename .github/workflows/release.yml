name: Publish NetBox Plan

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v${VERSION}"
      - name: Build Python packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m unittest discover -s tests -v
          python -m build --sdist --wheel --outdir dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "NetBox Plan ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes 'Экспериментальная версия. Перед внедрением в production проверьте интеграционные тесты NetBox/PostgreSQL на тестовом Docker-стенде.'
